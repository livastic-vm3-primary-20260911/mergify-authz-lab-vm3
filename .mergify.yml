commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: vm3-ff-review-freshness-v2
    merge_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = vm3-ff-review-hold-v2
    merge_method: fast-forward
    batch_size: 1

merge_queue:
  mode: serial
  max_parallel_checks: 1

pull_request_rules:
  - name: vm3-signature-chain-external-fork
    conditions:
      - number = 75
      - author = livastic-vm3-secondary-20260911
      - label = vm3-signature-chain-trigger
    actions:
      merge:
        method: merge

  - name: vm3-dismiss-review-preserve-change-request
    conditions:
      - head = vm3-dismiss-review-preserve
      - author = livastic-vm3-primary-20260911
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize

  - name: vm3-default-branch-timer-policy-source-probe
    conditions:
      - author = livastic-vm3-primary-20260911
      - title = VM3_DEFAULT_BRANCH_TIMER_MATCH_A_20260915
      - current-datetime >= 2026-09-15T06:57:12Z
    actions:
      merge:
        method: squash
