commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: vm3-qprefix-runtime-discriminator
    merge_conditions:
      - check-success = vm3-qprefix-never-20260915
    merge_method: merge
    batch_size: 1

merge_queue:
  mode: serial
  max_parallel_checks: 1
  queue_branch_prefix: refs/heads/vm3-qprefix-head-

pull_request_rules:
  - name: vm3-signature-chain-external-fork
    conditions:
      - number = 75
      - author = livastic-vm3-secondary-20260911
      - label = vm3-signature-chain-trigger
    actions:
      merge:
        method: merge

  - name: vm3-dismiss-review-preserve-change-request
    conditions:
      - head = vm3-dismiss-review-preserve
      - author = livastic-vm3-primary-20260911
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize
