commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

pull_request_rules:
  - name: vm3 human bot self-command echo
    conditions:
      - author = livastic-vm3-secondary-20260911
      - label = bug
      - -label = vm3-human-self-command-done
    actions:
      comment:
        message: "{{ body }}"
        bot_account: livastic-vm3-primary-20260911
      label:
        add:
          - vm3-human-self-command-done
        remove:
          - bug

queue_rules:
  - name: vm3-human-self-command-safe-sink
    queue_conditions: []
    merge_conditions:
      - label = vm3-never-merge-human-self-command
    merge_method: merge
    batch_size: 1

merge_queue:
  mode: serial
  max_parallel_checks: 1
