name: vm3 create required reviewer reuse PRs

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: create neutral-author control and impact PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh pr create --base main --head vm3-required-reviewer-control --title "Required reviewer identity control" --body "Controlled neutral-author PR for VM3 required-reviewer identity lifecycle testing."

          branch=vm3-required-reviewer-impact
          file=required-reviewer-impact.txt
          title="Required reviewer username-reuse impact"
          git switch main
          git switch -c "$branch"
          echo "$title" > "$file"
          git add "$file"
          git -c commit.gpgsign=false commit -m "$title"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "Controlled neutral-author PR for VM3 required-reviewer identity lifecycle testing."
