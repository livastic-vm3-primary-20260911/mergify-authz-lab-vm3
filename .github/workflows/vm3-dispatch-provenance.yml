name: vm3 dispatch provenance marker


on:
  workflow_dispatch:


permissions:
  contents: read
  issues: write


jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - name: emit PR-head impact marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" \
            -f title="VM3_DISPATCH_IMPACT_PR_HEAD" \
            -f body="PR-head workflow executed. run=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"

