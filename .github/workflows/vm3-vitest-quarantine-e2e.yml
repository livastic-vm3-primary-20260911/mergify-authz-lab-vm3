name: vm3-vitest-quarantine-e2e


on:
  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  vitest-quarantine-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare released Mergify Vitest fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vm3-vitest-e2e
          cd .vm3-vitest-e2e
          printf '%s\n' '{"name":"vm3-vitest-e2e","private":true,"type":"module"}' > package.json
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm add @mergifyio/vitest@0.3.7 vitest@4.1.10
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({
            test: {
              watch: false,
              reporters: [new MergifyReporter()],
            },
          });
          EOF
