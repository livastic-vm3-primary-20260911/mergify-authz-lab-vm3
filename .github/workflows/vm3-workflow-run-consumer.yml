name: VM3 Workflow Run Consumer
on:
  workflow_run:
    workflows: ["VM3 Workflow Run Source"]
    types: [completed]
jobs:
  workflow-run-candidate:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run released Mergify Vitest workflow_run candidate
        shell: bash
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
          echo "REF_NAME=$GITHUB_REF_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          echo "HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "TRIGGER_HEAD=${{ github.event.workflow_run.head_sha }}"
          echo "TRIGGER_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          WORK="$RUNNER_TEMP/vm3-workflow-run"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          cat > package.json <<'EOF'
          {"private":true,"type":"module"}
          EOF
          npm install --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          cat > workflow-run.test.js <<'EOF'
          import { describe, it, expect } from 'vitest';
          describe('merge-group-mode',()=>{
            it('rejects deterministic regression',()=>{ expect(true).toBe(false); });
          });
          EOF
          npx vitest run workflow-run.test.js --config vitest.config.mjs
