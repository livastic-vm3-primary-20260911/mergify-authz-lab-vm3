name: VM3 Workflow Run Consumer Chain
on:
  workflow_run:
    workflows: ["VM3 Workflow Run Source Chain"]
    types: [completed]
jobs:
  privileged-pr-head-consumer:
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run triggering PR head regression with released Mergify Vitest
        shell: bash
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
          echo "REF_NAME=$GITHUB_REF_NAME"
          echo "BASE_REF=${GITHUB_BASE_REF:-<unset>}"
          echo "HEAD_REF=${GITHUB_HEAD_REF:-<unset>}"
          echo "TRIGGER_HEAD=${{ github.event.workflow_run.head_sha }}"
          echo "TRIGGER_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          echo "CHECKED_OUT=$(git rev-parse HEAD)"
          npm install -g npm@10
          WORK="$RUNNER_TEMP/vm3-workflow-run-chain"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp "$GITHUB_WORKSPACE/vm3-workflow-run-regression.test.js" "$WORK/workflow-run.test.js"
          cd "$WORK"
          cat > package.json <<'EOF'
          {"private":true,"type":"module"}
          EOF
          npm install --legacy-peer-deps --no-audit --no-fund vitest@4.1.10 @mergifyio/vitest@0.3.7
          cat > vitest.config.mjs <<'EOF'
          import { defineConfig } from 'vitest/config';
          import { MergifyReporter } from '@mergifyio/vitest';
          export default defineConfig({test:{watch:false,reporters:['default',new MergifyReporter()]}});
          EOF
          npx vitest run workflow-run.test.js --config vitest.config.mjs
      - name: Trusted post-test sentinel
        run: |
          echo "POST_TEST_SENTINEL_EXECUTED trigger=${{ github.event.workflow_run.head_sha }} checked_out=$(git rev-parse HEAD)"
