name: vm3 create unsigned signature probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: create unsigned branch commit
        run: |
          set -eu
          git config user.name "vm3-unsigned-probe"
          git config user.email "vm3-unsigned-probe@example.invalid"
          git switch -c vm3-unsigned-signature-impact
          echo "unsigned signature impact marker" > unsigned-signature-impact.txt
          git add unsigned-signature-impact.txt
          git -c commit.gpgsign=false commit -m "Add unsigned signature impact commit"
          git push origin HEAD:refs/heads/vm3-unsigned-signature-impact
